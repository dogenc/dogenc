name: Code-Koi

# Zeichnet jede Nacht einen Pixel-Koi aus der öffentlichen GitHub-Aktivität
# (https://github.com/yalongwastaken/git-koi): Sprachen färben ihn, Beiträge lassen
# ihn wachsen, Serien zeichnen ihn, der vergangene Tag bestimmt, wie er schwimmt.

on:
  schedule:
    # Kurz nach Mitternacht UTC: der Koi zeigt den Tag, der gerade endete.
    # Bewusst nicht zur selben Minute wie die Coding-Aktivität (:17).
    - cron: "41 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/koi.yml, .github/scripts/koi-legend.mjs, .github/scripts/koi-snapshot.mjs]

permissions:
  contents: write

concurrency:
  group: koi
  cancel-in-progress: false

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fest auf Release v1.0.2 gepinnt, damit spätere Änderungen das Profil nicht brechen.
      - uses: yalongwastaken/git-koi@7305e9b1fadee6f43d3b4fa543a25d4cde79856e # v1.0.2
        with:
          body: gold
          output-dir: koi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Das Action-Ergebnis oben nutzt nur öffentliche Daten. Mit dem eigenen ACTIVITY_TOKEN
      # wird der Koi aus ALLEN Beiträgen und Repositories (auch privaten) neu gezeichnet.
      # Klappt das nicht, bleibt der öffentliche Koi stehen. Ein Fehler hier darf ihn nicht aufhalten.
      - name: Koi aus allen Beiträgen zeichnen und Legende erzeugen
        continue-on-error: true
        shell: bash
        env:
          ACTIVITY_TOKEN: ${{ secrets.ACTIVITY_TOKEN }}
        run: |
          snapshot="$RUNNER_TEMP/koi-snapshot.json"
          scope=public
          full="$RUNNER_TEMP/koi-full.json"
          # Squash-Korrektur wie bei der Aktivitäts-Grafik (Grafiken landen nur im Runner).
          export ACTIVITY_EXTRA="$RUNNER_TEMP/extra-commits.json"
          mkdir -p "$RUNNER_TEMP/insights"
          node .github/scripts/insights.mjs "$RUNNER_TEMP/insights" || echo "::warning::Squash-Korrektur nicht verfügbar."
          if [ -n "$ACTIVITY_TOKEN" ] && node .github/scripts/koi-snapshot.mjs "$full" \
             && git-koi render "$full" --output-dir "$RUNNER_TEMP/koi-full" --body gold > "$RUNNER_TEMP/caption.txt"; then
            cp "$RUNNER_TEMP/koi-full/koi.gif" koi/koi.gif
            snapshot="$full"
            scope=all
          else
            echo "::warning::Vollständige Daten nicht verfügbar – öffentlicher Koi bleibt."
            git-koi render "$snapshot" --output-dir "$RUNNER_TEMP/koi-check" --body gold > "$RUNNER_TEMP/caption.txt"
          fi
          cat "$RUNNER_TEMP/caption.txt"
          KOI_CAPTION="$(cat "$RUNNER_TEMP/caption.txt")" KOI_SCOPE="$scope" \
            node .github/scripts/koi-legend.mjs "$snapshot" assets/koi-legend.svg

      - name: Nur bei Änderungen committen
        shell: bash
        run: |
          git add koi/koi.gif assets/koi-legend.svg 2>/dev/null || git add koi/koi.gif
          if git diff --cached --quiet; then
            echo "Der Koi ist unverändert."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "chore(profile): Code-Koi neu zeichnen"
          # Die Aktivitäts-Grafik committet ebenfalls; vor dem Push den neuesten Stand holen.
          for attempt in 1 2 3; do
            git pull --quiet --rebase origin main && git push --quiet && exit 0
            sleep $((attempt * 10))
          done
          exit 1
